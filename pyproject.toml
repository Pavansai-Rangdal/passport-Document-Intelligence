[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "passport-expiry-classifier"
version = "0.1.0"
description = "Classify whether a passport is expired using OCR and MRZ extraction."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [
    { name = "Passport Document Intelligence Team" }
]
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
    "pydantic>=2.10,<3.0",
    "pydantic-settings>=2.7,<3.0",
    "python-multipart>=0.0.20",
    "Pillow>=11.0,<13.0",
    "opencv-python-headless>=4.10,<5.0",
    "PyMuPDF>=1.25,<2.0",
    "filetype>=1.2,<2.0",
    "httpx>=0.28,<1.0",
    "tenacity>=9.0,<10.0",
    "structlog>=25.1,<26.0",
    "orjson>=3.10,<4.0",
    "laya>=0.3.20",
]

[project.optional-dependencies]
ocr-paddle = [
    "paddleocr>=3.0,<4.0",
    "paddlepaddle>=3.0,<4.0",
]
ocr-tesseract = [
    "pytesseract>=0.3.13,<1.0",
]

[dependency-groups]
dev = [
    "ruff>=0.9,<1.0",
    "mypy>=1.14,<2.0",
    "pytesseract>=0.3.13,<1.0",
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.24,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = []

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
check_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
include = ["app"]

[tool.uv]
default-groups = ["dev"]
